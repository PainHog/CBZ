stroke="#1b1a24" stroke-width="2"/><text x="68" y="207" font-family="Alegreya Sans, sans-serif" font-size="15" font-weight="700" fill="#1b1a24">round 1</text><path d="M366 444L410 444" stroke="#e3a03a" stroke-width="9"/><circle cx="388" cy="470" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="388" y="476" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">1</text><path d="M377.76 84L409.76 84" stroke="#e3a03a" stroke-width="9"/><circle cx="393.76" cy="58" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="393.76" y="64" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">2</text><path d="M584 176L584 208" stroke="#e3a03a" stroke-width="9"/><circle cx="558" cy="192" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="558" y="198" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">3</text><rect x="778" y="238" width="44" height="44" fill="none" stroke="#a8641c" stroke-width="2.4" stroke-dasharray="6 4"/><circle cx="800" cy="260" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="800" y="266" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">4</text><text x="318" y="344" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Hall</text><text x="172" y="164" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Kitchen</text><text x="136" y="344" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Living room</text><text x="424" y="164" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Utility room</text><text x="800" y="200" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Landing</text><text x="656" y="200" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Bedroom</text><text x="944" y="200" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Study</text><text x="944" y="222" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="15" letter-spacing="2" fill="#c25a7c">THE DEN</text><text x="28" y="512" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" letter-spacing="2" fill="#a8641c">ENTRANCES</text><text x="28" y="539" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">1. Front door (behind Sam) — Big; Sweet; or Sneaky, Hard (round 1 only, one cat)</text><text x="28" y="560" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">2. Brutus’s dog door (a heavy flap) — Normal; no roll; makes noise</text><text x="28" y="581" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">3. Balcony door (up the tree) — Normal; Sneaky or Savage, Hard; a climb: Small things only</text><text x="28" y="602" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">4. Skylight, propped open — Tight; Sneaky or Savage, Tricky; a climb: Small things only</text><text x="28" y="631" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">A door drawn shut with a dashed swing is closed (Streetwise, Tricky; or Savage, Hard to open, unless the house says otherwise).</text><text x="28" y="650" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">The star marks where the prize is put down, and in which round. One square is about two cat lengths.</text>
</svg>
