ont-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve"> 2. Cat flap in the back door — Normal; no roll; makes noise</text><text x="54" y="594" font-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve"> 3. Open kitchen window (up the bins) — Normal; Sneaky or Savage, Tricky; a climb</text><text x="54" y="624" font-family="sans-serif" font-size="14" fill="#5b566a">Doors drawn with a swing are closed (Streetwise, Tricky; or Savage, Hard to open, unless the house says</text><text x="54" y="644" font-family="sans-serif" font-size="14" fill="#5b566a">   otherwise). One square is about two cat lengths.</text>
