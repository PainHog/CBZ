l-8 -6 l10 -1 Z" fill="#e3a03a" stroke="#1b1a24" stroke-width="2"/><text x="88" y="207" font-family="Alegreya Sans, sans-serif" font-size="15" font-weight="700" fill="#1b1a24">round 2</text><path d="M242 444L286 444" stroke="#e3a03a" stroke-width="9"/><circle cx="264" cy="470" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="264" y="476" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">1</text><path d="M371.84 84L403.84 84" stroke="#e3a03a" stroke-width="9"/><circle cx="387.84" cy="58" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="387.84" y="64" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">2</text><path d="M135.68 84L167.68 84" stroke="#e3a03a" stroke-width="9"/><circle cx="151.68" cy="58" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="151.68" y="64" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">3</text><text x="264" y="344" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Hall</text><text x="120" y="344" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Living room</text><text x="192" y="164" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Kitchen</text><text x="408" y="164" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Utility room</text><text x="408" y="344" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Downstairs loo</text><text x="408" y="366" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="15" letter-spacing="2" fill="#c25a7c">THE DEN</text><text x="560" y="52" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" letter-spacing="2" fill="#a8641c">ENTRANCES</text><text x="560" y="79" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">1. Front door (behind Mr Pell) — Big; Sweet; or Sneaky,</text><text x="560" y="100" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   Hard (round 1 only, one cat)</text><text x="560" y="121" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">2. Cat flap in the back door — Normal; no roll; makes</text><text x="560" y="142" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   noise</text><text x="560" y="163" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">3. Open kitchen window (up the bins) — Normal; Sneaky</text><text x="560" y="184" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   or Savage, Tricky; a climb: Small things only</text><text x="560" y="213" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">A door drawn shut with a dashed swing is closed</text><text x="560" y="232" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">(Streetwise, Tricky; or Savage, Hard to open, unless</text><text x="560" y="251" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">the house says otherwise). The star marks where the</text><text x="560" y="270" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">prize is put down, and in which round. One square is</text><text x="560" y="289" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">about two cat lengths.</text>
