family="Fraunces, serif" font-weight="700" font-size="17" fill="#1b1a24">Hall</text><text x="126" y="385.6" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="17" fill="#1b1a24">Living room</text><text x="198" y="198.39999999999998" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Kitchen</text><text x="414" y="198.39999999999998" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="17" fill="#1b1a24">Utility room</text><text x="414" y="385.6" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="17" fill="#1b1a24">Downstairs loo</text><text x="414" y="409.6" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="14" letter-spacing="2" fill="#c25a7c">THE DEN</text><path d="M84 207 l4 9 l10 1 l-8 6 l3 10 l-9 -6 l-9 6 l3 -10 l-8 -6 l10 -1 Z" fill="#e3a03a" stroke="#1b1a24" stroke-width="2"/><text x="102" y="225" font-family="sans-serif" font-size="14" font-weight="700" fill="#1b1a24">prize, round 2</text><path d="M248 466L292 466" stroke="#e3a03a" stroke-width="9"/><circle cx="270" cy="492" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="270" y="498" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="17" fill="#1b1a24">1</text><path d="M377.84 106L409.84 106" stroke="#e3a03a" stroke-width="9"/><circle cx="393.84" cy="80" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="393.84" y="86" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="17" fill="#1b1a24">2</text><path d="M141.68 106L173.68 106" stroke="#e3a03a" stroke-width="9"/><circle cx="157.68" cy="80" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="157.68" y="86" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="17" fill="#1b1a24">3</text><text x="550" y="112" font-family="sans-serif" font-weight="800" font-size="16" letter-spacing="2" fill="#a8641c">WAYS IN</text><text x="550" y="136" font-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">1. Front door (behind Mr Pell) — Big; Sweet;</text><text x="550" y="160" font-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   or Sneaky, Hard (round 1 only, one cat)</text><text x="550" y="184" font-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">2. Cat flap in the back door — Normal; no</text><text x="550" y="208" font-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   roll; makes noise</text><text x="550" y="232" font-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">3. Open kitchen window (up the bins) —</text><text x="550" y="256" font-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   Normal; Sneaky or Savage, Tricky; a climb</text><text x="550" y="286" font-family="sans-serif" font-size="14" fill="#5b566a">Doors drawn with a swing are closed (Streetwise,</text><text x="550" y="306" font-family="sans-serif" font-size="14" fill="#5b566a">Tricky; or Savage, Hard to open, unless the</text><text x="550" y="326" font-family="sans-serif" font-size="14" fill="#5b566a">house says otherwise). One square is about two</text><text x="550" y="346" font-family="sans-serif" font-size="14" fill="#5b566a">cat lengths.</text>
