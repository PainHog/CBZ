Sans, sans-serif" font-weight="800" font-size="17" letter-spacing="2" fill="#a8641c">ENTRANCES</text><text x="446" y="399" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">1. Front door (behind Grandpa) — Big; Sweet; or Sneaky, Hard (round 1</text><text x="446" y="420" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   only, one cat)</text><text x="446" y="441" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">2. Pom-Pom’s microchip cat flap (jam it open) — Normal; Streetwise,</text><text x="446" y="462" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   Tricky; makes noise, stays open once jammed</text><text x="446" y="483" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">3. Cracked cellar window — Tight; no roll</text><text x="446" y="504" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">4. Spare bedroom window (up the drainpipe) — Normal; Sneaky or Savage,</text><text x="446" y="525" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   Hard; a climb: Small things only</text><text x="446" y="554" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">A door drawn shut with a dashed swing is closed (Streetwise, Tricky; or</text><text x="446" y="573" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">Savage, Hard to open, unless the house says otherwise). The star marks</text><text x="446" y="592" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">where the prize is put down, and in which round. One square is about two</text><text x="446" y="611" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">cat lengths.</text>
