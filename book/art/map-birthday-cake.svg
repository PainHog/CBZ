oke="#fffaf0" stroke-width="9"/><path d="M496 127.2V184.8" stroke="#fffaf0" stroke-width="9"/><path d="M280 343.2V400.8" stroke="#fffaf0" stroke-width="9"/><path d="M304 189 l4 9 l10 1 l-8 6 l3 10 l-9 -6 l-9 6 l3 -10 l-8 -6 l10 -1 Z" fill="#e3a03a" stroke="#1b1a24" stroke-width="2"/><text x="320" y="207" font-family="Alegreya Sans, sans-serif" font-size="15" font-weight="700" fill="#1b1a24">round 1</text><path d="M88 233 l4 9 l10 1 l-8 6 l3 10 l-9 -6 l-9 6 l3 -10 l-8 -6 l10 -1 Z" fill="#e3a03a" stroke="#1b1a24" stroke-width="2"/><text x="104" y="251" font-family="Alegreya Sans, sans-serif" font-size="15" font-weight="700" fill="#1b1a24">round 5</text><path d="M330 444L374 444" stroke="#e3a03a" stroke-width="9"/><circle cx="352" cy="470" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="352" y="476" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">1</text><path d="M64 176L64 208" stroke="#e3a03a" stroke-width="9"/><circle cx="38" cy="192" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="38" y="198" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">2</text><path d="M531.84 84L563.84 84" stroke="#e3a03a" stroke-width="9"/><circle cx="547.84" cy="58" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="547.84" y="64" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">3</text><text x="352" y="344" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Hall</text><text x="388" y="164" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Kitchen</text><text x="172" y="200" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Dining room</text><text x="532" y="344" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Living room</text><text x="568" y="164" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Utility room</text><text x="172" y="380" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Downstairs loo</text><text x="172" y="402" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="15" letter-spacing="2" fill="#c25a7c">THE DEN</text><text x="700" y="52" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" letter-spacing="2" fill="#a8641c">ENTRANCES</text><text x="700" y="79" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">1. Front door (guests arriving) — Big;</text><text x="700" y="100" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   Sweet; or Sneaky, Hard (rounds 1–2</text><text x="700" y="121" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   only, one cat)</text><text x="700" y="142" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">2. Patio door, ajar — Big; no roll</text><text x="700" y="163" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">3. Utility window (up the water butt) —</text><text x="700" y="184" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   Normal; Sneaky or Savage, Tricky; a</text><text x="700" y="205" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   climb: Small things only</text><text x="700" y="234" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">A door drawn shut with a dashed swing is</text><text x="700" y="253" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">closed (Streetwise, Tricky; or Savage,</text><text x="700" y="272" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">Hard to open, unless the house says</text><text x="700" y="291" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">otherwise). The star marks where the</text><text x="700" y="310" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">prize is put down, and in which round.</text><text x="700" y="329" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">One square is about two cat lengths.</text>
</svg>
