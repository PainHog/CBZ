th="2.4"/><text x="704" y="220" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="17" fill="#1b1a24">3</text><path d="M630 264L630 308" stroke="#e3a03a" stroke-width="9"/><circle cx="656" cy="286" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="656" y="292" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="17" fill="#1b1a24">4</text><text x="54" y="522" font-family="sans-serif" font-weight="800" font-size="16" letter-spacing="2" fill="#a8641c">WAYS IN</text><text x="54" y="546" font-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">1. Front door (behind Mrs Okafor) — Big; Sweet; or Sneaky, Hard (round 1 only, one cat)</text><text x="54" y="570" font-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">2. Dog door — Normal; no roll</text><text x="54" y="594" font-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">3. Bathroom window (over the shed roof) — Normal; Sneaky or Savage, Tricky; a climb: Small things only</text><text x="54" y="618" font-family="sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">4. Garage side door, ajar — Big; no roll</text><text x="54" y="648" font-family="sans-serif" font-size="14" fill="#5b566a">Doors drawn with a swing are closed (Streetwise, Tricky; or Savage, Hard to open, unless the house says otherwise). One square is about two cat lengths.</text>
