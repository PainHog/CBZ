roke-linejoin="square"/><rect x="208" y="560" width="144" height="216" fill="none" stroke="#1b1a24" stroke-width="6" stroke-linejoin="square"/><rect x="352" y="560" width="216" height="216" fill="none" stroke="#1b1a24" stroke-width="6" stroke-linejoin="square"/><path d="M268 307.2V364.8" stroke="#fffaf0" stroke-width="9"/><path d="M311.2 228H368.8" stroke="#fffaf0" stroke-width="9"/><path d="M412 127.2V184.8" stroke="#fffaf0" stroke-width="9"/><path d="M208 639.2V696.8" stroke="#fffaf0" stroke-width="9"/><path d="M352 639.2V696.8" stroke="#fffaf0" stroke-width="9"/><rect x="336" y="244" width="48" height="36" fill="#efe2c7" stroke="#1b1a24" stroke-width="2"/><path d="M345.6 244V280" stroke="#1b1a24" stroke-width="1.5"/><path d="M355.2 244V280" stroke="#1b1a24" stroke-width="1.5"/><path d="M364.8 244V280" stroke="#1b1a24" stroke-width="1.5"/><path d="M374.4 244V280" stroke="#1b1a24" stroke-width="1.5"/><text x="400" y="300" text-anchor="end" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#1b1a24">stairs up</text><text x="400" y="317" text-anchor="end" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#1b1a24">to Landing</text><rect x="276" y="576" width="48" height="36" fill="#efe2c7" stroke="#1b1a24" stroke-width="2"/><path d="M285.6 576V612" stroke="#1b1a24" stroke-width="1.5"/><path d="M295.2 576V612" stroke="#1b1a24" stroke-width="1.5"/><path d="M304.8 576V612" stroke="#1b1a24" stroke-width="1.5"/><path d="M314.4 576V612" stroke="#1b1a24" stroke-width="1.5"/><text x="340" y="632" text-anchor="end" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#1b1a24">stairs down</text><text x="340" y="649" text-anchor="end" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#1b1a24">to Hall</text><path d="M292 405 l4 9 l10 1 l-8 6 l3 10 l-9 -6 l-9 6 l3 -10 l-8 -6 l10 -1 Z" fill="#e3a03a" stroke="#1b1a24" stroke-width="2"/><text x="308" y="423" font-family="Alegreya Sans, sans-serif" font-size="15" font-weight="700" fill="#1b1a24">round 1</text><path d="M76 377 l4 9 l10 1 l-8 6 l3 10 l-9 -6 l-9 6 l3 -10 l-8 -6 l10 -1 Z" fill="#e3a03a" stroke="#1b1a24" stroke-width="2"/><text x="92" y="395" font-family="Alegreya Sans, sans-serif" font-size="15" font-weight="700" fill="#1b1a24">round 5</text><path d="M318 444L362 444" stroke="#e3a03a" stroke-width="9"/><circle cx="340" cy="470" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="340" y="476" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">1</text><path d="M165.6 84L197.6 84" stroke="#e3a03a" stroke-width="9"/><circle cx="181.6" cy="58" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="181.6" y="64" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">2</text><path d="M64 652L64 684" stroke="#e3a03a" stroke-width="9"/><circle cx="38" cy="668" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="38" y="674" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">3</text><path d="M628 242L628 286" stroke="#e3a03a" stroke-width="9"/><circle cx="654" cy="264" r="15" fill="#e3a03a" stroke="#1b1a24" stroke-width="2.4"/><text x="654" y="270" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" fill="#1b1a24">4</text><text x="340" y="344" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Hall</text><text x="160" y="344" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Living room</text><text x="232" y="164" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Kitchen</text><text x="520" y="272" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Garage</text><text x="280" y="676" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Landing</text><text x="136" y="676" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="18" fill="#1b1a24">Bathroom</text><text x="460" y="676" text-anchor="middle" font-family="Fraunces, serif" font-weight="700" font-size="21" fill="#1b1a24">Tayo’s room</text><text x="460" y="698" text-anchor="middle" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="15" letter-spacing="2" fill="#c25a7c">THE DEN</text><text x="690" y="52" font-family="Alegreya Sans, sans-serif" font-weight="800" font-size="17" letter-spacing="2" fill="#a8641c">ENTRANCES</text><text x="690" y="79" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">1. Front door (behind Mrs Okafor) — Big;</text><text x="690" y="100" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   Sweet; or Sneaky, Hard (round 1 only,</text><text x="690" y="121" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   one cat)</text><text x="690" y="142" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">2. Dog door — Normal; no roll</text><text x="690" y="163" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">3. Bathroom window (over the shed roof)</text><text x="690" y="184" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   — Normal; Sneaky or Savage, Tricky; a</text><text x="690" y="205" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">   climb: Small things only</text><text x="690" y="226" font-family="Alegreya Sans, sans-serif" font-size="16" fill="#1b1a24" xml:space="preserve">4. Garage side door, ajar — Big; no roll</text><text x="690" y="255" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">A door drawn shut with a dashed swing is</text><text x="690" y="274" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">closed (Streetwise, Tricky; or Savage,</text><text x="690" y="293" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">Hard to open, unless the house says</text><text x="690" y="312" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">otherwise). The star marks where the</text><text x="690" y="331" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">prize is put down, and in which round.</text><text x="690" y="350" font-family="Alegreya Sans, sans-serif" font-size="15" fill="#5b566a">One square is about two cat lengths.</text>
</svg>
